# Sitio de RescatApp. Reemplaza TU_DOMINIO por el dominio real (en producción: rescatapp.online www.rescatapp.online) y copia este archivo a
# /etc/nginx/sites-available/rescatapp ; luego: sudo ln -s /etc/nginx/sites-available/rescatapp /etc/nginx/sites-enabled/
# y: sudo nginx -t && sudo systemctl reload nginx ; después solicita el certificado: sudo certbot --nginx -d TU_DOMINIO
server {
    server_name TU_DOMINIO;
    root /var/www/rescatapp;
    index index.html;
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / { try_files $uri /index.html; }
    # certbot agrega aquí el bloque de HTTPS (puerto 443) y la redirección desde el puerto 80
}
