$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"correo":"{{emailNuevo}}","password":"Prueba1234"}'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 401", function () { pm.response.to.have.status(401); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
    language: text/javascript
order: 8000
