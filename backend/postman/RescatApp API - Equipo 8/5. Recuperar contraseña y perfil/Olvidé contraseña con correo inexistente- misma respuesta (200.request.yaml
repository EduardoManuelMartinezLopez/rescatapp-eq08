$kind: http-request
name: "Olvidé contraseña con correo inexistente: misma respuesta (200)"
url: "{{baseUrl}}/api/auth/forgot"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "correo": "nadie-existe@rescatapp.test"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
      pm.test("No devuelve enlace", function () { pm.expect(pm.response.json().enlace_dev).to.be.undefined; });
    language: text/javascript
order: 2000
