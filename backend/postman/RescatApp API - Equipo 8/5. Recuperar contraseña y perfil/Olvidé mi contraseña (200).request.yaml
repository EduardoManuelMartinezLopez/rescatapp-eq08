$kind: http-request
url: "{{baseUrl}}/api/auth/forgot"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "correo": "{{emailNuevo}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
      const j = pm.response.json();
      pm.test("No revela datos sensibles y trae mensaje", function () { pm.expect(j.mensaje).to.be.a("string"); });
      pm.test("Modo desarrollo devuelve enlace", function () { pm.expect(j.enlace_dev).to.be.a("string"); });
      pm.collectionVariables.set("tokenReset", pm.response.json().enlace_dev.split("token=")[1]);
    language: text/javascript
order: 1000
