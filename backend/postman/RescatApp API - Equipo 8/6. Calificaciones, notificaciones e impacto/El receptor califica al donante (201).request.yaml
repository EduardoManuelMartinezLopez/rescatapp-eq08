$kind: http-request
url: "{{baseUrl}}/api/ratings"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"id_reserva": {{reservaId}}, "estrellas": 5, "comentario": "Todo en orden"}'
auth:
  type: bearer
  credentials:
    token: "{{tokenReceptor}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 201", function () { pm.response.to.have.status(201); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
    language: text/javascript
order: 3000
