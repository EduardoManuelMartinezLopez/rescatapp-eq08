$kind: http-request
url: "{{baseUrl}}/api/reservations/book"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"id_donacion": 999999 }'
auth:
  type: bearer
  credentials:
    token: "{{tokenReceptor}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 404", function () { pm.response.to.have.status(404); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
    language: text/javascript
order: 4000
