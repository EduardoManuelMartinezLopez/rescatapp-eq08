$kind: http-request
url: "{{baseUrl}}/api/reservations/{{reservaId}}/pickup"
method: PATCH
auth:
  type: bearer
  credentials:
    token: "{{tokenReceptor}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 403", function () { pm.response.to.have.status(403); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
    language: text/javascript
order: 8000
