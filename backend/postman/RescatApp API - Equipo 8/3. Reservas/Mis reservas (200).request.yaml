$kind: http-request
url: "{{baseUrl}}/api/reservations/mine"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenReceptor}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
      pm.test("Incluye la reserva", function () { pm.expect(pm.response.json().total).to.be.above(0); });
    language: text/javascript
order: 7000
