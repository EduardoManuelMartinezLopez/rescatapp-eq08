$kind: http-request
url: "{{baseUrl}}/api/reservations/book"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"id_donacion": {{donacionId}} }'
auth:
  type: bearer
  credentials:
    token: "{{tokenReceptor}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 201", function () { pm.response.to.have.status(201); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
      pm.collectionVariables.set("reservaId", pm.response.json().reserva.id_reserva);
    language: text/javascript
order: 5000
