$kind: http-request
url: "{{baseUrl}}/api/donations/{{donacionFotoId}}/foto"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
      pm.test("Es una imagen PNG", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("image/png"); });
    language: text/javascript
order: 2000
