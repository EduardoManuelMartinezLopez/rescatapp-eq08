$kind: http-request
url: "{{baseUrl}}/api/admin/reports/donations.csv?desde=2020-01-01"
method: GET
queryParams:
  desde: 2020-01-01
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
      pm.test("Es un CSV", function () { pm.expect(pm.response.headers.get("Content-Type")).to.include("text/csv"); });
    language: text/javascript
order: 5000
