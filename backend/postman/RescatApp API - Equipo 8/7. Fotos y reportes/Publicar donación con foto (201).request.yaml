$kind: http-request
url: "{{baseUrl}}/api/donations/publish"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: '{"titulo":"Pan del día (prueba Postman)","descripcion":"Donación creada por Postman","categoria":"Pan y repostería","kilos":10,"direccion":"Centro, Oaxaca de Juárez","latitud":17.0606,"longitud":-96.7253,"horario_recoleccion":"8:00 pm a 9:00 pm","acepta_buena_fe":true,"fecha_caducidad":"{{fechaFutura}}","foto":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg=="}'
auth:
  type: bearer
  credentials:
    token: "{{tokenDonante}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 201", function () { pm.response.to.have.status(201); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
      pm.test("Tiene foto", function () { pm.expect(pm.response.json().donacion.tiene_foto).to.eql(true); });
      pm.collectionVariables.set("donacionFotoId", pm.response.json().donacion.id_donacion);
    language: text/javascript
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set("fechaFutura", new Date(Date.now()+6*3600*1000).toISOString());
      pm.collectionVariables.set("fechaPasada", new Date(Date.now()-3600*1000).toISOString());
    language: text/javascript
order: 1000
