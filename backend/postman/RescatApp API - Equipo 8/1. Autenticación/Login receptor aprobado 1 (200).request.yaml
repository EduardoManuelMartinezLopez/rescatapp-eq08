$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "correo": "esperanza@rescatapp.test",
      "password": "Demo1234!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
      const j = pm.response.json();
      pm.test("Devuelve token JWT", function () { pm.expect(j.token).to.be.a("string"); });
      pm.collectionVariables.set("tokenReceptor", j.token);
    language: text/javascript
order: 6000
