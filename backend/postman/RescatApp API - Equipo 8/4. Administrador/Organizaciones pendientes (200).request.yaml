$kind: http-request
url: "{{baseUrl}}/api/admin/organizations?estado=pendiente"
method: GET
queryParams:
  estado: pendiente
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
      pm.test("Aparece el albergue", function () { pm.expect(pm.response.json().total).to.be.above(0); });
      pm.collectionVariables.set("idAlbergue", pm.response.json().organizaciones[0].id_usuario);
    language: text/javascript
order: 3000
