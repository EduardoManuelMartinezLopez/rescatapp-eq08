<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RescatApp Oaxaca</title>
    <meta name="description" content="Rescata alimentos excedentes y alimenta a tu comunidad en Oaxaca de Juárez." />

    <script>
      // Aplica el modo oscuro antes de pintar para evitar el "parpadeo" blanco
      try { var t = localStorage.getItem('rescatapp_tema'); if (t === 'oscuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  </body>
