$kind: http-request
url: "{{baseUrl}}/api/admin/organizations/{{idAlbergue}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "estado_validacion": "quizas"
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenAdmin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 400", function () { pm.response.to.have.status(400); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
    language: text/javascript
order: 4000
