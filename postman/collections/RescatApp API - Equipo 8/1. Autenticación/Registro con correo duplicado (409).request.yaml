$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "nombre": "Duplicado",
      "correo": "admin@rescatapp.test",
      "password": "Prueba1234",
      "rol": "donante"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 409", function () { pm.response.to.have.status(409); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
    language: text/javascript
order: 2000
