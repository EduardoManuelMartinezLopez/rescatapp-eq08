$kind: http-request
url: "{{baseUrl}}/api/donations"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tokenReceptor}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código de estado 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde en menos de 1000 ms", function () { pm.expect(pm.response.responseTime).to.be.below(1000); });
      pm.test("Trae lista", function () { pm.expect(pm.response.json().donaciones).to.be.an("array"); });
    language: text/javascript
order: 2000
